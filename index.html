<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>朴朴配送地图</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<header id="topbar">
  <div class="search">
    <span>🔍</span>
    <input id="q" type="search" placeholder="搜点名 / 别名 / 巷名" autocomplete="off">
  </div>
  <button class="iconbtn" id="btn-layers" title="图层">▦</button>
  <button class="iconbtn" id="btn-edit" title="编辑">✎</button>
</header>

<div id="results"></div>

<div id="panel">
  <label><input type="checkbox" id="chk-areas" checked> 片区面</label>
  <label><input type="checkbox" id="chk-lines" checked> 巷线</label>
  <label><input type="checkbox" id="chk-points" checked> 点位</label>
  <label><input type="checkbox" id="chk-labels" checked> 名称</label>
  <div class="sep"></div>
  <label><input type="checkbox" id="chk-overview"> 概图模式</label>
  <div class="sep"></div>
  <button class="btn btn-ghost" id="btn-locate" style="padding:8px;font-size:13px">回到我的位置</button>
  <button class="btn btn-ghost" id="btn-settings" style="padding:8px;font-size:13px;margin-top:6px">设置 / 数据</button>
</div>

<div id="empty">
  <b>还没有任何数据</b><br>
  点右上角 ✎ 进入编辑，<br>先画片区，再补点位。
</div>

<div id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div id="modal"><div class="modal-card" id="modal-card"></div></div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
